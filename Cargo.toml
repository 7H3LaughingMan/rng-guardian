[package]
name = "rng-guardian"
version = "14.0.0"
authors = ["7H3LaughingMan"]
edition = "2024"

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"

[lib]
crate-type = ["cdylib"]
path = "wasm/lib.rs"

[dependencies]
base64 = "0.22.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
rand = { version = "0.10.1" }
rand_pcg = "0.10.2"
wasm-bindgen = "0.2.121"
